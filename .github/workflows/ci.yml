name: Templates CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bun-hono-datastar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bun-hono-datastar
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: bun-hono-datastar/.bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The unit tests read the local database, so create its schema first.
      - name: Push database schema
        run: bun run db:push
      - name: Check
        run: bun run check
      - name: Build container
        run: docker build .

